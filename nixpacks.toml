[phases.setup]
nixPkgs = ["python311", "pango", "cairo", "gdk-pixbuf", "libffi", "shared-mime-info", "fontconfig"]

[phases.install]
cmds = ["python3 -m venv --copies /opt/venv && . /opt/venv/bin/activate && pip install -r requirements.txt"]

[start]
cmd = "uvicorn api.main:app --host 0.0.0.0 --port $PORT"
